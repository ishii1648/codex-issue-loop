name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    name: build-candidate
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
          cache-dependency-path: go.sum

      - name: Confirm target architecture
        run: test "$(uname -m)" = "arm64"

      - name: Validate annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git cat-file -t "${GITHUB_REF_NAME}" | grep -qx tag
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Run release quality gates
        run: make ci

      - name: Build the canonical candidate once
        shell: bash
        run: |
          set -euo pipefail
          source_epoch=$(git show -s --format=%ct "${GITHUB_SHA}")
          scripts/build-release.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${source_epoch}" dist/candidate
          dist/candidate/agent-loop_Darwin_arm64 version --json | jq -e \
            --arg version "${GITHUB_REF_NAME}" --arg commit "${GITHUB_SHA}" \
            '.version == $version and .commit == $commit and .target == "darwin/arm64" and .delivery_protocol == 1'

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/candidate/agent-loop_Darwin_arm64
            dist/candidate/agent-loop_Darwin_arm64.spdx.json
            dist/candidate/release-manifest.json
            dist/candidate/checksums.txt

      - uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
          if-no-files-found: error
          retention-days: 30

  verify-reproducibility:
    name: verify-reproducibility
    needs: build-candidate
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
      - name: Compare a verification-only rebuild
        run: |
          source_epoch=$(git show -s --format=%ct "${GITHUB_SHA}")
          scripts/build-release.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "$source_epoch" dist/comparison
          for asset in agent-loop_Darwin_arm64 agent-loop_Darwin_arm64.spdx.json release-manifest.json checksums.txt; do
            cmp "dist/candidate/$asset" "dist/comparison/$asset"
          done

  verify-attestation-and-manifest:
    name: verify-attestation-and-manifest
    needs: verify-reproducibility
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
      - name: Verify checksums, manifest, and candidate attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist/candidate
          shasum -a 256 -c checksums.txt
          jq -e --arg version "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            '.version == $version and .commit == $commit and .semantic_contract_current == 1 and .state_schema_current == 4' release-manifest.json
          gh attestation verify agent-loop_Darwin_arm64 --repo "$GITHUB_REPOSITORY"

  replay-production-fixtures:
    name: replay-production-fixtures
    needs: verify-attestation-and-manifest
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - name: Replay every byte-locked production fixture
        run: go test ./internal/application/recoveryfixture ./internal/application/conformance -run '^(TestBlessedReleaseFixturesMatchReviewedByteLock|TestBlessedProductionFixturesReplay100Percent)$' -count=1

  lifecycle-conformance:
    name: lifecycle-conformance
    needs: replay-production-fixtures
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - run: make conformance-test
      - run: make fault-test

  cli-surface-contract:
    name: cli-surface-contract
    needs: lifecycle-conformance
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install the pinned Codex CLI without authenticating
        run: npm install --global @openai/codex@0.136.0
      - name: Verify installed CLI surfaces without API calls
        env:
          CONTRACT_ARTIFACT_DIR: contract-artifacts
        run: scripts/cli-surface-contract.sh
      - name: Replay GitHub and worker boundary fixtures
        run: go test ./internal/adapter/github ./internal/adapter/worker ./internal/platform/compat -count=1
      - uses: actions/upload-artifact@v6
        with:
          name: cli-surface-contract-${{ github.sha }}
          path: contract-artifacts/cli-surface-report.json
          if-no-files-found: error

  isolated-canary:
    name: credentialless-isolated-canary
    needs: [build-candidate, cli-surface-contract]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
      - uses: actions/download-artifact@v7
        with:
          name: cli-surface-contract-${{ github.sha }}
          path: contract-artifacts
      - name: Prime the module cache before disabling external network access
        run: go mod download
      - name: Run two isolated lifecycle sequences with no credentials or network
        env:
          CANDIDATE_BINARY: dist/candidate/agent-loop_Darwin_arm64
          CONTRACT_ARTIFACT_DIR: contract-artifacts
        run: scripts/offline-release-contract.sh
      - uses: actions/upload-artifact@v6
        with:
          name: offline-contract-report-${{ github.sha }}
          path: contract-artifacts/offline-contract-report.json
          if-no-files-found: error
      - name: Attest credentialless contract evidence
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            contract-artifacts/cli-surface-report.json
            contract-artifacts/offline-contract-report.json
      - name: Publish the candidate prerelease from canonical bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate_tag="candidate-${GITHUB_REF_NAME}-${GITHUB_RUN_ID}"
          gh release create "$candidate_tag" dist/candidate/* contract-artifacts/*.json \
            --target "$GITHUB_SHA" --prerelease --title "$candidate_tag" --notes "Release candidate for $GITHUB_REF_NAME from $GITHUB_SHA"

  production-state-isolation:
    name: production-state-isolation
    needs: [build-candidate, isolated-canary]
    runs-on: macos-15
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
      - name: Require production-host state comparison evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tag="candidate-${GITHUB_REF_NAME}-${GITHUB_RUN_ID}"
          mkdir -p production-state
          found=false
          for attempt in $(seq 1 180); do
            if gh release download "$candidate_tag" --pattern production-state-report.json --dir production-state --clobber >/dev/null 2>&1; then
              found=true
              break
            fi
            sleep 30
          done
          test "$found" = true
          candidate_digest=$(shasum -a 256 dist/candidate/agent-loop_Darwin_arm64 | awk '{print $1}')
          jq -e --arg tag "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            --arg candidate_tag "$candidate_tag" --arg digest "$candidate_digest" '
              .schema_version == 1 and .release_tag == $tag and .release_commit == $commit and
              .candidate_tag == $candidate_tag and .candidate_binary_sha256 == $digest and
              .production_state_accessed == true and .production_state_changes == 0 and
              .production_before == .production_after and .production_before.worker_limit == 1 and
              .production_before.active_workers <= 1 and .production_before.doctor_ok == true and
              .offline_contract.mode == "credentialless-offline" and
              .offline_contract.credentials.canary_github_token == false and
              .offline_contract.credentials.openai_api_key == false and
              .offline_contract.external_network == false and
              (.offline_contract.sequences | length) == 2 and
              .offline_contract.supervisor_starts >= 2 and
              .offline_contract.webhook_fixture_replay == 1 and
              .offline_contract.transaction_crash_recovery == 1 and
              .offline_contract.final.active_workers == 0 and
              .offline_contract.final.active_leases == 0 and
              .offline_contract.final.pending_requests == 0 and
              .offline_contract.final.orphan_pid_pgid == 0 and
              .offline_contract.final.duplicate_prs == 0 and
              .offline_contract.final.duplicate_comment_markers == 0
            ' production-state/production-state-report.json >/dev/null
      - name: Attest production isolation evidence
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: production-state/production-state-report.json
      - uses: actions/upload-artifact@v6
        with:
          name: production-state-report-${{ github.sha }}
          path: production-state/production-state-report.json
          if-no-files-found: error

  soak:
    name: soak
    needs: production-state-isolation
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
      - name: Verify candidate bytes and attestation at start, 15 minutes, and 30 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p soak
          candidate_tag="candidate-${GITHUB_REF_NAME}-${GITHUB_RUN_ID}"
          expected_digest=$(shasum -a 256 dist/candidate/agent-loop_Darwin_arm64 | awk '{print $1}')
          for checkpoint in start minute-15 minute-30; do
            mkdir -p "soak/$checkpoint"
            gh release download "$candidate_tag" --pattern agent-loop_Darwin_arm64 --dir "soak/$checkpoint" --clobber
            cmp dist/candidate/agent-loop_Darwin_arm64 "soak/$checkpoint/agent-loop_Darwin_arm64"
            gh attestation verify "soak/$checkpoint/agent-loop_Darwin_arm64" --repo "$GITHUB_REPOSITORY"
            actual_digest=$(shasum -a 256 "soak/$checkpoint/agent-loop_Darwin_arm64" | awk '{print $1}')
            jq -n --arg checkpoint "$checkpoint" --arg tag "$candidate_tag" \
              --arg expected "$expected_digest" --arg actual "$actual_digest" \
              '{schema_version:1,checkpoint:$checkpoint,candidate_tag:$tag,expected_sha256:$expected,actual_sha256:$actual,byte_identical:($expected == $actual),attestation_verified:true}' \
              >"soak/$checkpoint.json"
            if [ "$checkpoint" != minute-30 ]; then sleep 900; fi
          done
      - uses: actions/upload-artifact@v6
        with:
          name: soak-health-${{ github.sha }}
          path: soak
          if-no-files-found: error

  promotion-evidence:
    name: promotion-evidence
    needs: soak
    runs-on: macos-15
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: evidence/candidate
      - uses: actions/download-artifact@v7
        with:
          name: cli-surface-contract-${{ github.sha }}
          path: evidence/contracts
      - uses: actions/download-artifact@v7
        with:
          name: offline-contract-report-${{ github.sha }}
          path: evidence/contracts
      - uses: actions/download-artifact@v7
        with:
          name: production-state-report-${{ github.sha }}
          path: evidence/production
      - uses: actions/download-artifact@v7
        with:
          name: soak-health-${{ github.sha }}
          path: evidence/soak
      - name: Authorize promotion from machine-verifiable evidence
        shell: bash
        run: |
          set -euo pipefail
          digest=$(shasum -a 256 evidence/candidate/agent-loop_Darwin_arm64 | awk '{print $1}')
          jq -e '.schema_version == 1 and .mode == "no-auth-surface" and .inference_requests == 0' evidence/contracts/cli-surface-report.json >/dev/null
          jq -e --arg digest "$digest" '
            .schema_version == 1 and .mode == "credentialless-offline" and .candidate_sha256 == $digest and
            .external_network == false and (.sequences | length) == 2 and
            .final.active_workers == 0 and .final.active_leases == 0 and .final.pending_requests == 0 and
            .final.orphan_pid_pgid == 0 and .final.duplicate_prs == 0 and .final.duplicate_comment_markers == 0
          ' evidence/contracts/offline-contract-report.json >/dev/null
          jq -e --arg digest "$digest" --arg commit "$GITHUB_SHA" '
            .schema_version == 1 and .release_commit == $commit and .candidate_binary_sha256 == $digest and
            .production_state_changes == 0 and .production_before == .production_after and .production_before.doctor_ok == true
          ' evidence/production/production-state-report.json >/dev/null
          for checkpoint in start minute-15 minute-30; do
            jq -e --arg digest "$digest" --arg checkpoint "$checkpoint" '
              .schema_version == 1 and .checkpoint == $checkpoint and
              .expected_sha256 == $digest and .actual_sha256 == $digest and
              .byte_identical == true and .attestation_verified == true
            ' "evidence/soak/$checkpoint.json" >/dev/null
          done
          jq -n --arg commit "$GITHUB_SHA" --arg tag "$GITHUB_REF_NAME" --arg digest "$digest" \
            '{schema_version:1,mode:"machine-verifiable",commit:$commit,tag:$tag,candidate_sha256:$digest,
              required_evidence:["cli-surface","offline-contract","production-isolation","soak-start","soak-minute-15","soak-minute-30"],authorized:true}' \
            > promotion-evidence.json
      - name: Attest promotion evidence
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: promotion-evidence.json
      - uses: actions/upload-artifact@v6
        with:
          name: promotion-evidence-${{ github.sha }}
          path: promotion-evidence.json
          if-no-files-found: error

  promote-stable:
    name: promote-stable
    needs: [build-candidate, promotion-evidence]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
      - uses: actions/download-artifact@v7
        with:
          name: cli-surface-contract-${{ github.sha }}
          path: dist/contracts
      - uses: actions/download-artifact@v7
        with:
          name: offline-contract-report-${{ github.sha }}
          path: dist/contracts
      - uses: actions/download-artifact@v7
        with:
          name: production-state-report-${{ github.sha }}
          path: dist/production-state
      - name: Publish stable release without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/candidate/* dist/contracts/*.json dist/production-state/production-state-report.json \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  post-release-health:
    name: post-release-health
    needs: promote-stable
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
      - name: Read back stable metadata, attestation, and candidate byte equality
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate_tag="candidate-${GITHUB_REF_NAME}-${GITHUB_RUN_ID}"
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease,assets \
            --jq 'select(.tagName == "'"$GITHUB_REF_NAME"'" and (.isDraft|not) and (.isPrerelease|not) and (.assets|length) == 7)' >/dev/null
          mkdir -p dist/stable dist/prerelease
          gh release download "$GITHUB_REF_NAME" --dir dist/stable
          gh release download "$candidate_tag" --dir dist/prerelease
          for asset in agent-loop_Darwin_arm64 agent-loop_Darwin_arm64.spdx.json release-manifest.json checksums.txt cli-surface-report.json offline-contract-report.json production-state-report.json; do
            cmp "dist/prerelease/$asset" "dist/stable/$asset"
          done
          for asset in agent-loop_Darwin_arm64 agent-loop_Darwin_arm64.spdx.json release-manifest.json checksums.txt; do
            cmp "dist/candidate/$asset" "dist/stable/$asset"
          done
          gh attestation verify dist/stable/agent-loop_Darwin_arm64 --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/stable/cli-surface-report.json --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/stable/offline-contract-report.json --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/stable/production-state-report.json --repo "$GITHUB_REPOSITORY"
          dist/stable/agent-loop_Darwin_arm64 version --json | jq -e --arg version "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" '.version == $version and .commit == $commit'
      - name: Require production delivery health evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for attempt in $(seq 1 180); do
            if gh release download "$GITHUB_REF_NAME" --pattern production-health-report.json --dir dist/stable --clobber >/dev/null 2>&1; then
              found=true
              break
            fi
            sleep 30
          done
          test "$found" = true
          stable_digest=$(shasum -a 256 dist/stable/agent-loop_Darwin_arm64 | awk '{print $1}')
          jq -e --arg tag "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" --arg digest "$stable_digest" '
            .schema_version == 1 and .release_tag == $tag and .release_commit == $commit and
            .stable_binary_sha256 == $digest and .installed.version == $tag and .installed.commit == $commit and
            .delivery.current.version == $tag and .delivery.current.commit == $commit and
            .delivery.phase == "succeeded" and .delivery.result == "succeeded" and
            .doctor.schema_version == 1 and .doctor.ok == true and (.doctor.failed_diagnostic_codes | length) == 0 and
            .status.worker_limit == 1 and .status.active_workers <= 1 and
            .rollback_occurred == false and .healthy == true
          ' dist/stable/production-health-report.json >/dev/null
          gh release view "$GITHUB_REF_NAME" --json assets --jq 'select((.assets|length) == 8)' >/dev/null
      - name: Attest production health evidence
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/stable/production-health-report.json
      - uses: actions/upload-artifact@v6
        with:
          name: production-health-report-${{ github.sha }}
          path: dist/stable/production-health-report.json
          if-no-files-found: error
