name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated stable tag to release
        required: true
        type: string
      release_commit:
        description: Commit peeled from release_tag
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || github.sha }}

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-candidate:
    name: build-candidate
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
          cache-dependency-path: go.sum

      - name: Confirm target architecture
        run: test "$(uname -m)" = "arm64"

      - name: Validate annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -t "${RELEASE_TAG}" | grep -qx tag
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "${RELEASE_COMMIT}"
          git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/main

      - name: Run release quality gates
        run: make ci

      - name: Build the canonical candidate once
        shell: bash
        run: |
          set -euo pipefail
          source_epoch=$(git show -s --format=%ct "${RELEASE_COMMIT}")
          scripts/build-release.sh "${RELEASE_TAG}" "${RELEASE_COMMIT}" "${source_epoch}" dist/candidate
          dist/candidate/agent-loop_Darwin_arm64 version --json | jq -e \
            --arg version "${RELEASE_TAG}" --arg commit "${RELEASE_COMMIT}" \
            '.version == $version and .commit == $commit and .target == "darwin/arm64" and .delivery_protocol == 1 and .assignment_protocol == 1'

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/candidate/agent-loop_Darwin_arm64
            dist/candidate/agent-loop_Darwin_arm64.spdx.json
            dist/candidate/release-manifest.json
            dist/candidate/checksums.txt

      - uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
          if-no-files-found: error
          retention-days: 30

  verify-reproducibility:
    name: verify-reproducibility
    needs: build-candidate
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
      - name: Compare a verification-only rebuild
        run: |
          source_epoch=$(git show -s --format=%ct "${RELEASE_COMMIT}")
          scripts/build-release.sh "${RELEASE_TAG}" "${RELEASE_COMMIT}" "$source_epoch" dist/comparison
          for asset in agent-loop_Darwin_arm64 agent-loop_Darwin_arm64.spdx.json release-manifest.json checksums.txt; do
            cmp "dist/candidate/$asset" "dist/comparison/$asset"
          done

  verify-attestation-and-manifest:
    name: verify-attestation-and-manifest
    needs: verify-reproducibility
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
      - name: Verify checksums, manifest, and candidate attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist/candidate
          shasum -a 256 -c checksums.txt
          jq -e --arg version "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
            '.version == $version and .commit == $commit and .assignment_protocol == 1 and .semantic_contract_current == 4 and .semantic_contract_minimum == 1 and .state_schema_current == 5 and .state_schema_migration_from == 4 and .issue_lifecycle_api_current == "2.0" and .issue_lifecycle_api_minimum == "1.0"' release-manifest.json
          gh attestation verify agent-loop_Darwin_arm64 --repo "$GITHUB_REPOSITORY"

  replay-production-fixtures:
    name: replay-production-fixtures
    needs: verify-attestation-and-manifest
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - name: Replay every byte-locked production fixture
        run: go test ./internal/application/recoveryfixture ./internal/application/conformance -run '^(TestBlessedReleaseFixturesMatchReviewedByteLock|TestBlessedProductionFixturesReplay100Percent)$' -count=1

  lifecycle-conformance:
    name: lifecycle-conformance
    needs: replay-production-fixtures
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - run: make conformance-test
      - run: make fault-test

  cli-surface-contract:
    name: cli-surface-contract
    needs: lifecycle-conformance
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install the pinned Codex CLI without authenticating
        run: npm install --global @openai/codex@0.136.0
      - name: Verify installed CLI surfaces without API calls
        env:
          CONTRACT_ARTIFACT_DIR: contract-artifacts
        run: scripts/cli-surface-contract.sh
      - name: Replay GitHub and worker boundary fixtures
        run: go test ./internal/adapter/github ./internal/adapter/worker ./internal/platform/compat -count=1
      - uses: actions/upload-artifact@v6
        with:
          name: cli-surface-contract-${{ github.sha }}
          path: contract-artifacts/cli-surface-report.json
          if-no-files-found: error

  isolated-canary:
    name: credentialless-isolated-canary
    needs: [build-candidate, cli-surface-contract]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
      - uses: actions/download-artifact@v7
        with:
          name: cli-surface-contract-${{ github.sha }}
          path: contract-artifacts
      - name: Prime the module cache before disabling external network access
        run: go mod download
      - name: Run two isolated lifecycle sequences with no credentials or network
        env:
          CANDIDATE_BINARY: dist/candidate/agent-loop_Darwin_arm64
          CONTRACT_ARTIFACT_DIR: contract-artifacts
        run: |
          chmod 0755 "$CANDIDATE_BINARY"
          scripts/offline-release-contract.sh
      - name: Verify repository assignment isolation and crash recovery offline
        env:
          CANARY_GITHUB_TOKEN: ""
          OPENAI_API_KEY: ""
        run: |
          go test ./internal/application/delivery -run '^(TestPerRepositoryApplyAndRollbackLeaveOtherRepositoryBytesUnchanged|TestRunningRepositorySwitchPreservesOtherPIDAndSnapshot|TestLegacyRuntimeSwitchUsesTargetStateLockWithoutGlobalFence|TestAssignmentResumesCrashAfterConfigCommit|TestAssignmentResumesInterruptedRollback|TestAssignmentRollbackFailureRetainsRepositoryFence|TestAssignmentDrainTimeoutDoesNotStopActiveWorker)$' -count=1
      - uses: actions/upload-artifact@v6
        with:
          name: offline-contract-report-${{ github.sha }}
          path: contract-artifacts/offline-contract-report.json
          if-no-files-found: error
      - name: Attest credentialless contract evidence
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            contract-artifacts/cli-surface-report.json
            contract-artifacts/offline-contract-report.json
      - name: Publish the candidate prerelease from canonical bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate_tag="candidate-${RELEASE_TAG}-${GITHUB_RUN_ID}"
          gh release create "$candidate_tag" dist/candidate/* contract-artifacts/*.json \
            --target "$RELEASE_COMMIT" --prerelease --title "$candidate_tag" --notes "Release candidate for $RELEASE_TAG from $RELEASE_COMMIT"

  production-state-isolation:
    name: production-state-isolation
    needs: [build-candidate, isolated-canary]
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
      - name: Require production-host state comparison evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tag="candidate-${RELEASE_TAG}-${GITHUB_RUN_ID}"
          mkdir -p production-state
          found=false
          for attempt in $(seq 1 180); do
            if gh release download "$candidate_tag" --pattern production-state-report.json --dir production-state --clobber >/dev/null 2>&1; then
              found=true
              break
            fi
            sleep 30
          done
          test "$found" = true
          candidate_digest=$(shasum -a 256 dist/candidate/agent-loop_Darwin_arm64 | awk '{print $1}')
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
            --arg candidate_tag "$candidate_tag" --arg digest "$candidate_digest" '
              def exact_keys($expected): keys == ($expected | sort);
              exact_keys(["schema_version","public_payload","release_tag","release_commit","candidate_tag",
                "candidate_binary_sha256","production_state_accessed","production_state_changes",
                "production_state_equal","production_health","offline_contract","private_evidence_sha256"]) and
              (.production_health | exact_keys(["doctor_safe","worker_limit_enforced","active_workers_within_limit"])) and
              (.offline_contract | exact_keys(["mode","credentials_absent","external_network",
                "lifecycle_sequences_complete","final_resources_clean"])) and
              .schema_version == 2 and .public_payload == "redacted-summary" and
              .release_tag == $tag and .release_commit == $commit and
              .candidate_tag == $candidate_tag and .candidate_binary_sha256 == $digest and
              .production_state_accessed == true and .production_state_changes == 0 and
              .production_state_equal == true and .production_health.doctor_safe == true and
              .production_health.worker_limit_enforced == true and
              .production_health.active_workers_within_limit == true and
              .offline_contract.mode == "credentialless-offline" and .offline_contract.credentials_absent == true and
              .offline_contract.external_network == false and
              .offline_contract.lifecycle_sequences_complete == true and
              .offline_contract.final_resources_clean == true and
              (.private_evidence_sha256 | test("^[0-9a-f]{64}$"))
            ' production-state/production-state-report.json >/dev/null
      - name: Attest production isolation evidence
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: production-state/production-state-report.json
      - uses: actions/upload-artifact@v6
        with:
          name: production-state-report-${{ github.sha }}
          path: production-state/production-state-report.json
          if-no-files-found: error

  candidate-integrity:
    name: candidate-integrity
    needs: production-state-isolation
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
      - name: Verify immutable candidate bytes and attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-integrity/download
          candidate_tag="candidate-${RELEASE_TAG}-${GITHUB_RUN_ID}"
          expected_digest=$(shasum -a 256 dist/candidate/agent-loop_Darwin_arm64 | awk '{print $1}')
          gh release download "$candidate_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern agent-loop_Darwin_arm64 --dir candidate-integrity/download --clobber
          cmp dist/candidate/agent-loop_Darwin_arm64 candidate-integrity/download/agent-loop_Darwin_arm64
          gh attestation verify candidate-integrity/download/agent-loop_Darwin_arm64 --repo "$GITHUB_REPOSITORY"
          actual_digest=$(shasum -a 256 candidate-integrity/download/agent-loop_Darwin_arm64 | awk '{print $1}')
          jq -n --arg tag "$candidate_tag" --arg expected "$expected_digest" --arg actual "$actual_digest" \
            '{schema_version:1,candidate_tag:$tag,expected_sha256:$expected,actual_sha256:$actual,
              byte_identical:($expected == $actual),attestation_verified:true}' \
            >candidate-integrity/report.json
      - uses: actions/upload-artifact@v6
        with:
          name: candidate-integrity-${{ github.sha }}
          path: candidate-integrity/report.json
          if-no-files-found: error

  promotion-evidence:
    name: promotion-evidence
    needs: candidate-integrity
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: evidence/candidate
      - uses: actions/download-artifact@v7
        with:
          name: cli-surface-contract-${{ github.sha }}
          path: evidence/contracts
      - uses: actions/download-artifact@v7
        with:
          name: offline-contract-report-${{ github.sha }}
          path: evidence/contracts
      - uses: actions/download-artifact@v7
        with:
          name: production-state-report-${{ github.sha }}
          path: evidence/production
      - uses: actions/download-artifact@v7
        with:
          name: candidate-integrity-${{ github.sha }}
          path: evidence/integrity
      - name: Authorize promotion from machine-verifiable evidence
        shell: bash
        run: |
          set -euo pipefail
          digest=$(shasum -a 256 evidence/candidate/agent-loop_Darwin_arm64 | awk '{print $1}')
          jq -e '.schema_version == 1 and .mode == "no-auth-surface" and .inference_requests == 0' evidence/contracts/cli-surface-report.json >/dev/null
          jq -e --arg digest "$digest" '
            .schema_version == 1 and .mode == "credentialless-offline" and .candidate_sha256 == $digest and
            .external_network == false and (.sequences | length) == 2 and
            .final.active_workers == 0 and .final.active_executions == 0 and .final.pending_requests == 0 and
            .final.orphan_pid_pgid == 0 and .final.duplicate_prs == 0 and .final.duplicate_comment_markers == 0
          ' evidence/contracts/offline-contract-report.json >/dev/null
          jq -e --arg digest "$digest" --arg commit "$RELEASE_COMMIT" '
            def exact_keys($expected): keys == ($expected | sort);
            exact_keys(["schema_version","public_payload","release_tag","release_commit","candidate_tag",
              "candidate_binary_sha256","production_state_accessed","production_state_changes",
              "production_state_equal","production_health","offline_contract","private_evidence_sha256"]) and
            (.production_health | exact_keys(["doctor_safe","worker_limit_enforced","active_workers_within_limit"])) and
            (.offline_contract | exact_keys(["mode","credentials_absent","external_network",
              "lifecycle_sequences_complete","final_resources_clean"])) and
            .schema_version == 2 and .release_commit == $commit and .candidate_binary_sha256 == $digest and
            .public_payload == "redacted-summary" and .production_state_changes == 0 and
            .production_state_equal == true and .production_health.doctor_safe == true and
            .production_health.worker_limit_enforced == true and
            .production_health.active_workers_within_limit == true and
            .offline_contract.credentials_absent == true and .offline_contract.external_network == false and
            .offline_contract.lifecycle_sequences_complete == true and
            .offline_contract.final_resources_clean == true and
            (.private_evidence_sha256 | test("^[0-9a-f]{64}$"))
          ' evidence/production/production-state-report.json >/dev/null
          jq -e --arg digest "$digest" '
            .schema_version == 1 and .expected_sha256 == $digest and .actual_sha256 == $digest and
            .byte_identical == true and .attestation_verified == true
          ' evidence/integrity/report.json >/dev/null
          jq -n --arg commit "$RELEASE_COMMIT" --arg tag "$RELEASE_TAG" --arg digest "$digest" \
            '{schema_version:1,mode:"machine-verifiable",commit:$commit,tag:$tag,candidate_sha256:$digest,
              required_evidence:["cli-surface","offline-contract","production-isolation","candidate-integrity"],authorized:true}' \
            > promotion-evidence.json
      - name: Attest promotion evidence
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: promotion-evidence.json
      - uses: actions/upload-artifact@v6
        with:
          name: promotion-evidence-${{ github.sha }}
          path: promotion-evidence.json
          if-no-files-found: error

  promote-stable:
    name: promote-stable
    needs: [build-candidate, promotion-evidence]
    runs-on: macos-15
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
      - uses: actions/download-artifact@v7
        with:
          name: cli-surface-contract-${{ github.sha }}
          path: dist/contracts
      - uses: actions/download-artifact@v7
        with:
          name: offline-contract-report-${{ github.sha }}
          path: dist/contracts
      - uses: actions/download-artifact@v7
        with:
          name: production-state-report-${{ github.sha }}
          path: dist/production-state
      - name: Publish stable release without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/candidate/* dist/contracts/*.json dist/production-state/production-state-report.json \
            --verify-tag --generate-notes --title "$RELEASE_TAG"

  verify-stable-release:
    name: verify-stable-release
    needs: promote-stable
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
      - name: Read back stable metadata, attestation, and candidate byte equality
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate_tag="candidate-${RELEASE_TAG}-${GITHUB_RUN_ID}"
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets \
            --jq 'select(.tagName == "'"$RELEASE_TAG"'" and (.isDraft|not) and (.isPrerelease|not) and (.assets|length) == 7)' >/dev/null
          mkdir -p dist/stable dist/prerelease
          gh release download "$RELEASE_TAG" --dir dist/stable
          gh release download "$candidate_tag" --dir dist/prerelease
          for asset in agent-loop_Darwin_arm64 agent-loop_Darwin_arm64.spdx.json release-manifest.json checksums.txt cli-surface-report.json offline-contract-report.json production-state-report.json; do
            cmp "dist/prerelease/$asset" "dist/stable/$asset"
          done
          for asset in agent-loop_Darwin_arm64 agent-loop_Darwin_arm64.spdx.json release-manifest.json checksums.txt; do
            cmp "dist/candidate/$asset" "dist/stable/$asset"
          done
          gh attestation verify dist/stable/agent-loop_Darwin_arm64 --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/stable/cli-surface-report.json --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/stable/offline-contract-report.json --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/stable/production-state-report.json --repo "$GITHUB_REPOSITORY"
          chmod 0755 dist/stable/agent-loop_Darwin_arm64
          dist/stable/agent-loop_Darwin_arm64 version --json | jq -e --arg version "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" '.version == $version and .commit == $commit and .assignment_protocol == 1'
