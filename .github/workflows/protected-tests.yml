name: Protected contract tests

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.targets.outputs.pairs }}
    steps:
      - id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
          PUSH_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request_target ]; then
            pairs=$(jq -cn --arg base "$BASE" --arg head "$HEAD" --arg number "$NUMBER" '[{base:$base,head:$head,number:$number}]')
          else
            pairs=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" | jq -sc --arg base "$PUSH_SHA" --arg ref "$BASE_REF" '[.[][] | select(.base.ref == $ref) | {base:$base,head:.head.sha,number:(.number|tostring)}]')
          fi
          echo "pairs=$pairs" >> "$GITHUB_OUTPUT"
  protected-tests-gate:
    name: Protected tests gate
    needs: targets
    if: needs.targets.outputs.pairs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(needs.targets.outputs.pairs) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.pair.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: false
      - name: Inspect immutable PR pair using trusted base code
        env:
          BASE_SHA: ${{ matrix.pair.base }}
          HEAD_SHA: ${{ matrix.pair.head }}
          PR_NUMBER: ${{ matrix.pair.number }}
        run: |
          git fetch origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          mkdir -p review-artifacts
          GO111MODULE=off go run scripts/protected-tests/main.go > review-artifacts/protected-tests.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: protected-tests-${{ matrix.pair.number }}-${{ matrix.pair.base }}-${{ matrix.pair.head }}
          path: review-artifacts/protected-tests.json
          if-no-files-found: error
