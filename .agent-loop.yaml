version: 2

github:
  repo: ishii1648/codex-issue-loop
  ready_labels: [codex-loop:ready]
  exclude_labels: [blocked, do-not-automate]
  running_label: codex-loop:running
  needs_input_label: codex-loop:needs-input
  failed_label: codex-loop:failed
  done_label: codex-loop:done

queue:
  poll_interval: 60s
  concurrency: 1
  order: issue_number_asc
  priority_labels: []
  max_attempts: 3
  continue_after_needs_input: true

worker:
  command: codex
  model: null
  sandbox: workspace-write
  session_mode: resumable
  timeout: 2h
  timeout_grace: 30s
  ambiguous_profile: extended
  profiles:
    standard:
      max_continuations: 0
    extended:
      max_continuations: 3

watch:
  reconcile_interval: 60s
  reconcile_jitter: 10%

git:
  branch_prefix: codex/issue-
  worktree_root: null
  base_branch: main

completion:
  create_draft_pr: true
  auto_merge: true
  close_issue: true

worktrees:
  completed_max_age: 168h
  failed_max_age: 720h
  blocked_max_age: 0s
  needs_input_max_age: 0s

notifications:
  enabled: false
  provider: ntfy
  endpoint: https://ntfy.sh
  topic: replace-with-opaque-topic
  include_details: false
  timeout: 10s
  min_interval: 5s
  retry_initial: 10s
  retry_max: 10m
  max_attempts: 8

logs:
  rotate_bytes: 16777216
  rotate_interval: 24h
  generations: 7
  worker_run_max_age: 720h
  worker_run_max_count: 100

security:
  redact_env: []
