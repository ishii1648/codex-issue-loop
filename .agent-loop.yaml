version: 4

github:
  repo: ishii1648/codex-issue-loop
  repository_id: 1334901081
  ready_labels: [codex-loop:ready]
  exclude_labels: [blocked, do-not-automate]
  running_label: codex-loop:running
  needs_input_label: codex-loop:needs-input
  failed_label: codex-loop:failed
  done_label: codex-loop:done

queue:
  poll_interval: 60s
  concurrency: 2
  order: issue_number_asc
  priority_labels: []
  max_attempts: 3
  continue_after_needs_input: true

resources:
  metadata_version: 1
  definitions:
    - name: config
      paths: [.agent-loop*.yaml, internal/config/**, docs/resource-admission.md, docs/specification.md]
    - name: scheduler
      paths: [internal/supervisor/**, internal/state/**, internal/webhook/**, internal/schema/**, internal/failure/**, internal/fsutil/**]
    - name: github
      paths: [internal/github/**, internal/publish/**, internal/publication/**]
    - name: worker
      paths: [internal/worker/**, schemas/**]
    - name: host
      paths: [cmd/**, internal/app/**, internal/launchd/**, internal/registry/**, internal/layout/**, internal/lifecycle/**, internal/worktree/**]
    - name: operations
      paths: [internal/observe/**, internal/retention/**, internal/redact/**, docs/*runbook.md]
    - name: release
      paths: [.github/**, scripts/**, Makefile, go.mod, go.sum, assets.go, internal/compat/**, internal/migration/**, docs/release.md, docs/compatibility.md, docs/migration.md]
    - name: docs
      paths: [.gitignore, README.md, AGENTS.md, docs/**]

worker:
  command: codex
  model: null
  sandbox: workspace-write
  session_mode: resumable
  timeout: 2h
  timeout_grace: 30s
  ambiguous_profile: extended
  profiles:
    standard:
      max_continuations: 0
    extended:
      max_continuations: 3

watch:
  reconcile_interval: 60s
  reconcile_jitter: 10%

git:
  branch_prefix: codex/issue-
  worktree_root: null
  base_branch: main

formatters:
  go:
    enabled: true
    timeout: 30s

completion:
  create_draft_pr: true
  auto_merge: false
  close_issue: true

worktrees:
  completed_max_age: 168h
  failed_max_age: 720h
  blocked_max_age: 0s
  needs_input_max_age: 0s

logs:
  rotate_bytes: 16777216
  rotate_interval: 24h
  generations: 7
  worker_run_max_age: 720h
  worker_run_max_count: 100

security:
  redact_env: []

# Cloudflare Tunnelとrepository webhookの準備が完了するまではpollingを維持する。
# 先にmodeをwebhookへ切り替えると、deliveryが届かない間の検知が15分のsafety sweep
# だけになり、60秒pollingより遅くなる。有効化手順は
# docs/mac-mini-runbook.md#12-webhook-brokerとreverse-proxy を参照する。
webhook:
  mode: polling
  # 有効化時は次のコメントを外し、<>のプレースホルダを実値へ置換する。
  # public_url_identifierは監査用の非secret識別子であり、tokenを含むURLを書かない。
  # secret_sourceはrepository外のowner-only (0600) fileを指す絶対パスにする。
  # mode: webhook
  # listener_address: 127.0.0.1:8787
  # public_url_identifier: hooks.<domain>/github/webhook
  # secret_source:
  #   file: /Users/<mac-mini-user>/Library/Application Support/codex-issue-loop/credentials/ishii1648-codex-issue-loop.webhook
  # installation_ids: []
  # allow_repository_webhook: true
  # safety_sweep_interval: 15m
  # safety_sweep_jitter: 10%
  # max_body_bytes: 2097152
  # read_timeout: 10s
  # read_header_timeout: 5s
  # idle_timeout: 30s
  # max_concurrent: 16
