version: 4

github:
  repo: owner/repository
  ready_labels: [codex-loop:ready]
  exclude_labels: [blocked, do-not-automate]
  running_label: codex-loop:running
  needs_input_label: codex-loop:needs-input
  failed_label: codex-loop:failed
  done_label: codex-loop:done

queue:
  poll_interval: 60s
  concurrency: 2
  order: issue_number_asc
  # Used from highest to lowest when order is priority_then_created_at.
  priority_labels: []
  max_attempts: 3
  continue_after_needs_input: true

resources:
  metadata_version: 1
  definitions:
    - name: application
      paths: [src/**]
    - name: docs
      paths: [README.md, docs/**]

worker:
  command: codex
  model: null
  # Experimental opt-in for extended continuations. Initial and standard runs
  # continue to use `codex exec` even when enabled.
  app_server:
    enabled: false
    goal_token_budget: 200000
    goal_time_budget: 2h
  sandbox: workspace-write
  session_mode: resumable
  timeout: 2h
  timeout_grace: 30s
  ambiguous_profile: extended
  profiles:
    standard:
      max_continuations: 0
    extended:
      max_continuations: 3

watch:
  reconcile_interval: 60s
  reconcile_jitter: 10%

git:
  branch_prefix: codex/issue-
  worktree_root: null
  base_branch: main

# Fixed built-in adapter; no shell command or extra arguments are accepted.
formatters:
  go:
    enabled: false
    timeout: 30s

completion:
  create_draft_pr: true
  # false: CI成功後にReady for reviewへ移し、人手のmergeを待つ。
  # true: CI成功後にsquash mergeまで実行する。
  auto_merge: false
  close_issue: true

# A dirty Pull Request is recovered in its existing worktree and branch.
conflict_recovery:
  max_attempts_per_base: 3
  max_base_updates: 3

# 0s means that worktrees in the status are retained indefinitely.
worktrees:
  completed_max_age: 168h
  failed_max_age: 720h
  blocked_max_age: 0s
  needs_input_max_age: 0s

logs:
  rotate_bytes: 16777216
  rotate_interval: 24h
  generations: 7
  worker_run_max_age: 720h
  worker_run_max_count: 100

# Values are read from these environment variables at runtime. Never put the
# secret values themselves in this file.
security:
  redact_env: []
