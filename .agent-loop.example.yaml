version: 5

github:
  repo: owner/repository
  # Required only when webhook.mode is webhook.
  # repository_id: 123456789
  # Labels that people use to admit or exclude work are repository policy.
  ready_labels: [codex-loop:ready]
  exclude_labels: [blocked, do-not-automate]

queue:
  concurrency: 1

# Keep definitions while production concurrency is limited to 1 so a future,
# explicitly gated rollout does not need to infer the resource taxonomy.
resources:
  definitions:
    - name: application
      paths: [src/**]
    - name: docs
      paths: [README.md, AGENTS.md, CLAUDE.md, docs/**]

git:
  base_branch: main

# Opt in only when the repository uses Go. This is a fixed built-in adapter;
# no shell command or extra arguments are accepted.
formatters:
  go:
    enabled: false

completion:
  # false: CI成功後にReady for reviewへ移し、人手のmergeを待つ。
  # true: CI成功後にsquash mergeまで実行する。
  auto_merge: false

# Explicit fallback is polling. See docs/mac-mini-runbook.md before opting in.
# Switch to webhook only after the reverse proxy and the GitHub webhook are both
# ready. While deliveries cannot reach the broker, the only remaining detection
# path is the 15 minute safety sweep, which is slower than 60 second polling.
webhook:
  mode: polling
  # The connection fields below are required only when mode is webhook.
  # listener_address must be a literal loopback address.
  # mode: webhook
  # listener_address: 127.0.0.1:8787
  # Non-secret audit identifier for the public endpoint. Never write a URL that
  # carries a query token.
  # public_url_identifier: hooks.example.invalid/github/webhook
  # Owner-only (0600) file outside the repository. Prefer a file source over env
  # because LaunchAgent environments are hard to provision safely.
  # secret_source:
  #   file: /Users/example/Library/Application Support/codex-issue-loop/credentials/owner-repository.webhook
  # Keep an installation allowlist for GitHub Apps. A classic repository webhook
  # has no installation, so it requires an empty list plus the explicit opt-in.
  # installation_ids: [987654]
  # allow_repository_webhook: false
